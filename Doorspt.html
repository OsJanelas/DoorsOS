<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Doors 300</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.3);
            --bg-window: rgba(255, 255, 255, 0.7);
            --text: #000;
            --accent: #0078d4;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .dark-mode {
            --glass: rgba(0, 0, 0, 0.4);
            --bg-window: rgba(25, 25, 25, 0.85);
            --text: #fff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1635776062127-d379bfcba9f8?q=80&w=2000') no-repeat center center fixed;
            background-size: cover;
            transition: background 0.5s ease;
        }

        /* --- MENU INICIAR --- */
        #start-menu {
            position: absolute;
            bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 500px; height: 550px;
            background: var(--bg-window);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: var(--shadow);
            display: none;
            flex-direction: column;
            padding: 30px;
            z-index: 2000;
            color: var(--text);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #start-menu.active {
            display: flex; opacity: 1; transform: translateX(-50%) translateY(0);
        }

        .search-box {
            width: 100%; padding: 12px;
            border-radius: 10px; border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.2); color: var(--text);
            margin-bottom: 25px; box-sizing: border-box;
        }

        .start-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
        }

        .start-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 12px; cursor: pointer; transition: 0.2s;
        }

        .start-item:hover { transform: scale(1.1); }
        .app-icon-circle { width: 45px; height: 45px; border-radius: 12px; margin-bottom: 8px; }

        /* --- JANELAS --- */
        .window {
            position: absolute;
            top: 100px; left: 150px;
            width: 600px; height: 400px;
            background: var(--bg-window);
            backdrop-filter: blur(25px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: var(--shadow);
            display: none; flex-direction: column;
            z-index: 100; color: var(--text);
            overflow: hidden;
        }

        .window-header {
            padding: 12px 18px; background: rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; font-weight: 500;
        }

        .close-btn {
            background: #ff5f56; width: 14px; height: 14px;
            border-radius: 50%; cursor: pointer; border: none;
        }

        .window-content { padding: 25px; flex: 1; overflow-y: auto; }

        /* --- BARRA DE TAREFAS --- */
        #taskbar {
            position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            height: 60px; background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; padding: 0 15px; gap: 15px; z-index: 3000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .icon { width: 36px; height: 36px; cursor: pointer; transition: 0.2s; padding: 4px; }
        .icon:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); border-radius: 8px; }

        /* --- UI COMPONENTS --- */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

    </style>
</head>
<body>

<div id="desktop" onclick="closeStartOutside(event)">
    
    <div id="start-menu">
        <input type="text" class="search-box" placeholder="Pesquisar">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span style="font-weight: bold;">Fixados</span>
            <span style="font-size: 12px; color: var(--accent); cursor: pointer;">TODOS OS APLICATIVOS ></span>
        </div>
        <div class="start-grid">
            <div class="start-item" onclick="openWin('win-files')">
                <div class="app-icon-circle" style="background: #f39c12; display: flex; align-items: center; justify-content: center;">📁</div>
                Arquivos
            </div>
            <div class="start-item" onclick="openWin('win-settings')">
                <div class="app-icon-circle" style="background: #7f8c8d; display: flex; align-items: center; justify-content: center;">⚙️</div>
                Ajustes
            </div>
            <div class="start-item">
                <div class="app-icon-circle" style="background: #3498db; display: flex; align-items: center; justify-content: center;">🌐</div>
                Não funcional
            </div>
            <div class="start-item">
                <div class="app-icon-circle" style="background: #27ae60; display: flex; align-items: center; justify-content: center;">📝</div>
                Notes (não funcional)
            </div>
        </div>
    </div>

    <div id="win-files" class="window">
        <div class="window-header" onmousedown="dragStart(event, 'win-files')">
            <span>Arquivos</span>
            <button class="close-btn" onclick="closeWin('win-files')"></button>
        </div>
        <div class="window-content">
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div style="text-align: center; cursor: pointer;"><span style="font-size: 40px;">📂</span><br>Projetos</div>
                <div style="text-align: center; cursor: pointer;"><span style="font-size: 40px;">🖼️</span><br>Fotos</div>
                <div style="text-align: center; cursor: pointer;"><span style="font-size: 40px;">📄</span><br>Documentos</div>
            </div>
        </div>
    </div>

    <div id="win-settings" class="window">
        <div class="window-header" onmousedown="dragStart(event, 'win-settings')">
            <span>Ajustes</span>
            <button class="close-btn" onclick="closeWin('win-settings')"></button>
        </div>
        <div class="window-content">
            <h2 style="margin-top: 0;">Sistema</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.05); padding: 15px; border-radius: 10px;">
                <div>
                    <strong>Modo escuro</strong><br>
                    <small>Mudar tema</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkToggle" onclick="toggleDarkMode()">
                    <span class="slider"></span>
                </label>
            </div>
            <p style="margin-top: 20px;">Versão: Doors 300 (feito in HTML)</p>
        </div>
    </div>

    <div id="taskbar">
        <img src="https://th.bing.com/th/id/R.0309288b72cf755c56c7777e64cba618?rik=efXdfHckNOSgbA&pid=ImgRaw&r=0" class="icon" onclick="toggleStart(event)">
        <img src="https://img.icons8.com/color/48/folder-invoices--v1.png" class="icon" onclick="openWin('win-files')">
        <img src="https://img.icons8.com/color/48/settings--v1.png" class="icon" onclick="openWin('win-settings')">
        <div style="width: 2px; height: 30px; background: rgba(255,255,255,0.2); margin: 0 5px;"></div>
        <div id="clock" style="font-size: 12px; color: var(--text); text-align: center; font-weight: bold; cursor: default;">00:00</div>
    </div>

</div>

<script>
    // FUNÇÃO MENU INICIAR
    function toggleStart(e) {
        e.stopPropagation();
        const menu = document.getElementById('start-menu');
        if (menu.classList.contains('active')) {
            menu.classList.remove('active');
            setTimeout(() => menu.style.display = 'none', 300);
        } else {
            menu.style.display = 'flex';
            setTimeout(() => menu.classList.add('active'), 10);
        }
    }

    function closeStartOutside(e) {
        const menu = document.getElementById('start-menu');
        if (!menu.contains(e.target)) {
            menu.classList.remove('active');
            setTimeout(() => menu.style.display = 'none', 300);
        }
    }

    // GESTÃO DE JANELAS
    function openWin(id) {
        const win = document.getElementById(id);
        win.style.display = 'flex';
        bringToFront(win);
    }

    function closeWin(id) {
        document.getElementById(id).style.display = 'none';
    }

    function bringToFront(win) {
        document.querySelectorAll('.window').forEach(w => w.style.zIndex = "100");
        win.style.zIndex = "500";
    }

    // TEMA
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }

    // RELÓGIO
    function updateClock() {
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('clock').innerText = time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // DRAG AND DROP (ARRASTAR JANELAS)
    let currentWin = null;
    let offsetX, offsetY;

    function dragStart(e, id) {
        currentWin = document.getElementById(id);
        bringToFront(currentWin);
        offsetX = e.clientX - currentWin.offsetLeft;
        offsetY = e.clientY - currentWin.offsetTop;
        
        document.onmousemove = dragMove;
        document.onmouseup = dragEnd;
    }

    function dragMove(e) {
        if (currentWin) {
            currentWin.style.left = (e.clientX - offsetX) + "px";
            currentWin.style.top = (e.clientY - offsetY) + "px";
        }
    }

    function dragEnd() {
        currentWin = null;
        document.onmousemove = null;
    }
</script>

</body>
</html>
